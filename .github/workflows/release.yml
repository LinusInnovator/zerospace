name: HD Detective Release Builder

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run Test Suite
        run: |
          ZEROSPACE_NO_BROWSER=1 ./launch.sh 8080 > "$RUNNER_TEMP/zerospace.log" 2>&1 &
          for attempt in {1..30}; do
            BASE_URL=$(sed -nE 's/^URL: (http:\/\/127\.0\.0\.1:[0-9]+)$/\1/p' "$RUNNER_TEMP/zerospace.log" | tail -1)
            if [ -n "$BASE_URL" ]; then export ZEROSPACE_BASE_URL="$BASE_URL"; break; fi
            sleep 1
          done
          test -n "${ZEROSPACE_BASE_URL:-}" || { cat "$RUNNER_TEMP/zerospace.log"; exit 1; }
          python3 test_suite.py
          python3 test_edge_cases.py
          python3 test_cli.py
          npm run test:browser

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zerospace-release-diagnostics
          path: |
            test-results/browser/
            playwright-report/
            ${{ runner.temp }}/zerospace.log

      - name: Create Release Archive (.tar.gz)
        run: |
          tar -czvf hd-optimizer-detective-${{ github.ref_name }}.tar.gz scanner_backend.py index.html app.js styles.css launch.sh LICENSE README.md SECURITY.md ARCHITECTURE.md CONTRIBUTING.md CHANGELOG.md pyproject.toml Formula package.json package-lock.json playwright.config.js tests examples test_suite.py test_edge_cases.py test_cli.py verify_security_hardening.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: hd-optimizer-detective-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
