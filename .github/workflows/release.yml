name: HD Detective Release Builder

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Test Suite
        run: |
          ZEROSPACE_NO_BROWSER=1 python3 scanner_backend.py > /dev/null 2>&1 &
          sleep 2
          ZEROSPACE_BASE_URL=http://127.0.0.1:8080 python3 test_suite.py

      - name: Create Release Archive (.tar.gz)
        run: |
          tar -czvf hd-optimizer-detective-${{ github.ref_name }}.tar.gz scanner_backend.py index.html app.js styles.css launch.sh LICENSE README.md SECURITY.md ARCHITECTURE.md CONTRIBUTING.md CHANGELOG.md pyproject.toml Formula

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: hd-optimizer-detective-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
