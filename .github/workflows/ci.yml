name: HD Detective CI Test Runner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Launch Local Backend Daemon
        run: |
          ZEROSPACE_NO_BROWSER=1 python3 scanner_backend.py > /dev/null 2>&1 &
          sleep 2

      - name: Static checks
        run: |
          python3 -m py_compile scanner_backend.py test_suite.py verify_security_hardening.py
          node --check app.js
          git diff --check

      - name: Run Automated Test Suite
        env:
          ZEROSPACE_BASE_URL: http://127.0.0.1:8080
        run: |
          python3 test_suite.py
