name: HD Detective CI Test Runner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Launch Local Backend Daemon
        run: |
          python3 scanner_backend.py > /dev/null 2>&1 &
          sleep 2

      - name: Run Automated Test Suite
        run: |
          python3 test_suite.py
